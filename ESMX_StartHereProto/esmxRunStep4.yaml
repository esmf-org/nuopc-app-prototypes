ESMX:

  App:
    globalResourceControl:  true
    logKindFlag:            ESMF_LOGKIND_Multi
    logAppendFlag:          false
    logFlush:               true
    startTime:              2012-10-24T08:00:00
    stopTime:               2012-10-24T20:00:00

    ESMF_RUNTIME_PROFILE:         ON
    ESMF_RUNTIME_PROFILE_OUTPUT:  SUMMARY

  Driver:
    attributes:
      Verbosity: high
    componentList:  [ABC, DEF]

    runSequence: |
      @900
        ABC -> DEF
        DEF -> ABC
        ABC
        DEF
      @

ABC:
  model:        ESMX_Data
  attributes:
    Verbosity:  high
    Diagnostic: 131072  # bit-17 (netcdf field output)
  timeKeeping:  Model
  geometries:
    global:
      geom:           grid1PeriDim
      minCornerCoord: [-180, -89]
      maxCornerCoord: [+180, +89]
      maxIndex:       [ 100,  50]
      staggerLoc:     center
  exportFields:
    sea_surface_temperature: {geometry: global, typekind: r8, dataInit: 273}

DEF:
  model:        ESMX_Data
  attributes:
    Verbosity:  high
    Diagnostic: 131072  # bit-17 (netcdf field output)
  timeKeeping:  Model
  geometries:
    global:
      geom:           grid1PeriDim
      minCornerCoord: [-180, -89]
      maxCornerCoord: [+180, +89]
      maxIndex:       [ 200, 100]
      staggerLoc:     center
  importFields:
    sea_surface_temperature:
      geometry: global
      typekind: r8
      dataMin:  260
      dataMax:  280
