ESMX:

  Driver:
    componentList:          [ATM, OCN]
    attributes:
      Verbosity: low

    runSequence: |
      @*
        ATM -> OCN :unmappedAction=ignore
        OCN -> ATM :unmappedAction=ignore
        ATM
        OCN
      @

  Components:

    ATM:
      model:            Tawas
      attributes:
        Verbosity:  low
      petList:          0-1

    OCN:
      model:            lumo
      petList:          2-3
      attributes:
        Verbosity:  low
