ESMX:

  App:
    globalResourceControl:  true
    logKindFlag:            ESMF_LOGKIND_Multi
    logAppendFlag:          false
    logFlush:               true
    startTime:              2012-10-24T18:00:00
    stopTime:               2012-10-24T19:00:00

  Driver:
    componentList:          [ATM, OCN]
    attributes:
      Verbosity: low
    runSequence: |
      @900
        ATM -> OCN  :unmappedAction=ignore
        OCN -> ATM  :unmappedAction=ignore
        ATM
        OCN
      @

ATM:
  model:            ESMX_Data   # use the ESMX data component
  ompNumThreads:    4
  stdout:
    filename:       atm.stdout
  attributes:
    Verbosity:      low
    Diagnostic:     131072  # bit-17 (netcdf field output)
  petList:          [3, [2-0]]  # petList is list of scalars and lists.
                                # each list again can be of scalars and lists
                                # recursively.
  timeKeeping:      Model
  geometries:
    global:
      geom:           gridNoPeriDim
      minCornerCoord: [  10,  20]
      maxCornerCoord: [ 100, 200]
      maxIndex:       [  10, 100]
      coordSys:       CART

  importFields:
    sea_surface_temperature:
      geometry:     global
      typekind:     r8
      dataValidate: {min: 0.0, max: 100.1}
    sea_surface_salinity:
      geometry:     global
      typekind:     r8
      dataValidate: {min: 199.9, max: 200.1}

  exportFields:
    air_pressure_at_sea_level:  {geometry: global, typekind: r8, dataInit: 2.5}
    precipitation_flux:         {geometry: global, typekind: r8, dataInit: 3.5}
    surface_net_downward_shortwave_flux:
      geometry:   global
      typekind:   r8
      dataInit:   4.5

OCN:
  model:            lumo
  petList:          [0-1, 3]
  stdout:
    filename:   ocn.stdout.*
  attributes:
    Verbosity:  low
